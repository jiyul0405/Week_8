<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e6f6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>동물 합치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root {
    --bg1: #e6f6ff;
    --bg2: #c9ecc4;
    --ink: #3f4a2e;
    --ink-soft: #7a8a62;
    --card: rgba(255, 255, 255, 0.85);
    --pen-edge: #c9a77a;
    --accent: #4fb36b;
    --accent-dark: #3a8f52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    font-family: 'Jua', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 8px);
  }

  /* 상단 HUD */
  header { display: flex; gap: 8px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 6px 12px;
    box-shadow: 0 2px 0 rgba(0,0,0,.05), 0 4px 14px rgba(63,74,46,.12);
  }
  .score { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .label { font-size: 12px; color: var(--ink-soft); }
  #score { font-size: 30px; line-height: 1.05; }
  #score.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .best { font-size: 13px; color: var(--ink-soft); }
  .next { width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .next img { width: 38px; height: 38px; object-fit: contain; }
  .icon-btn {
    width: 48px; border: none; cursor: pointer; font-size: 20px; color: var(--ink);
    display: grid; place-items: center;
  }

  /* 게임 영역 (울타리) */
  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: flex-end; justify-content: center; }
  #pen {
    border: 5px solid var(--pen-edge); border-top: none;
    border-radius: 0 0 26px 26px; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 30%),
      linear-gradient(180deg, #fffdf3 0%, #f4f9e4 60%, #e3f1cc 100%);
    box-shadow: 0 10px 30px rgba(63,74,46,.18);
  }
  canvas { display: block; touch-action: none; }
  #toast {
    position: absolute; top: 14%; left: 50%; transform: translate(-50%, -10px);
    background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px;
    font-size: 16px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 진화 단계 표시 */
  .evo { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 8px; }
  .evo img {
    width: 6.6%; object-fit: contain; filter: grayscale(1); opacity: .3;
    transition: filter .3s, opacity .3s, transform .3s;
  }
  .evo img.on { filter: none; opacity: 1; }
  .evo img.top { transform: translateY(-3px) scale(1.2); }

  /* 오버레이 */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(63,74,46,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .panel {
    width: min(310px, 86vw); background: #fff; border-radius: 26px; padding: 26px 24px 22px;
    text-align: center; box-shadow: 0 14px 40px rgba(63,74,46,.3);
  }
  .panel h1 { font-size: 34px; font-weight: normal; }
  .panel h2 { font-size: 28px; font-weight: normal; }
  .panel .hero { width: 110px; margin: 8px auto 4px; display: block; }
  .panel p { color: var(--ink-soft); font-size: 15px; line-height: 1.5; margin-top: 6px; }
  .panel .big { font-size: 44px; color: var(--ink); margin-top: 2px; }
  .btn {
    margin-top: 16px; font-family: inherit; font-size: 20px; color: #fff; cursor: pointer;
    background: var(--accent); border: none; border-radius: 999px; padding: 12px 34px;
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="card score">
      <span class="label">점수</span>
      <span id="score">0</span>
      <span class="best">최고 <span id="best">0</span></span>
    </div>
    <div class="card next">
      <span class="label">다음</span>
      <img id="nextImg" alt="">
    </div>
    <button class="card icon-btn" id="soundBtn" aria-label="소리 켜기/끄기">🔊</button>
  </header>

  <div id="stage">
    <div id="pen"><canvas id="game"></canvas></div>
    <div id="toast"></div>
  </div>

  <div class="card evo" id="evo"></div>
</div>

<div class="overlay" id="startScreen">
  <div class="panel">
    <h1>동물 합치기</h1>
    <img class="hero" id="heroImg" alt="">
    <p>같은 동물끼리 만나면 다음 친구로 변신!<br>병아리부터 시작해서 젖소까지 키워 보세요.<br>동물이 점선 위에 오래 있으면 끝나요.</p>
    <button class="btn" id="startBtn">시작하기</button>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="panel">
    <h2>게임 오버</h2>
    <p>이번 점수</p>
    <div class="big" id="finalScore">0</div>
    <p id="finalInfo"></p>
    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
const { Engine, Bodies, Body, Composite, Events } = Matter;

// ===== 설정 =====
const W = 400;                   // 게임 월드 너비 (화면에 맞춰 확대/축소)
let H = 620;                     // 높이는 화면 비율에 맞춰 560~760 사이로 자동 조절
const DANGER_Y = 100;            // 이 선 위에 동물이 오래 머물면 게임 오버
const DROP_Y = 48;               // 동물을 떨어뜨리는 높이
const STEP = 1000 / 60;          // 물리 고정 시간 간격
const DANGER_LIMIT = 2500;       // 선 위에 머물 수 있는 시간(ms)
const COMBO_WINDOW = 1100;       // 이 시간 안에 다음 합체가 일어나면 콤보
const ASSET = '수박게임에셋_동물테마_충남대평생교육/수박게임에셋_동물테마_충남대평생교육/';

// body: 이미지 안에서 얼굴(충돌 원)의 [중심x, 중심y, 반지름] (픽셀)
const ANIMALS = [
  { name: '병아리', file: '01_chick.png',   r: 14,  color: '#ffd23f', body: [72, 74, 68] },
  { name: '개구리', file: '02_frog.png',    r: 18,  color: '#7cc94f', body: [79, 78, 72] },
  { name: '펭귄',   file: '03_penguin.png', r: 23,  color: '#4a5468', body: [89, 82, 80] },
  { name: '돼지',   file: '04_pig.png',     r: 28,  color: '#ff9fb4', body: [110, 88, 80] },
  { name: '양',     file: '05_sheep.png',   r: 34,  color: '#f3e9d2', body: [139, 100, 95] },
  { name: '고양이', file: '06_cat.png',     r: 40,  color: '#f2a65a', body: [119, 128, 100] },
  { name: '강아지', file: '07_dog.png',     r: 47,  color: '#f08a3c', body: [125, 138, 105] },
  { name: '토끼',   file: '08_rabbit.png',  r: 54,  color: '#ffb3c7', body: [123, 182, 98] },
  { name: '코알라', file: '09_koala.png',   r: 61,  color: '#9a9aa6', body: [164, 120, 100] },
  { name: '호랑이', file: '10_tiger.png',   r: 68,  color: '#ff9f1c', body: [132, 132, 106] },
  { name: '판다',   file: '11_panda.png',   r: 76,  color: '#333333', body: [166, 162, 128] },
  { name: '곰',     file: '12_bear.png',    r: 84,  color: '#a0663b', body: [158, 162, 124] },
  { name: '여우',   file: '13_fox.png',     r: 92,  color: '#ff7a2f', body: [153, 176, 120] },
  { name: '젖소',   file: '14_cow.png',     r: 100, color: '#5a4a42', body: [195, 192, 132] },
];
const MERGE_SCORE = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66, 78, 91]; // 만들어진 동물 단계별 점수
const FINAL_BONUS = 150;                                                 // 젖소 두 마리가 만나면 사라지며 보너스
const SPAWN_WEIGHTS = [30, 25, 20, 15, 10];                              // 떨어지는 동물: 병아리~양
const LAST = ANIMALS.length - 1;

ANIMALS.forEach(a => {
  a.img = new Image();
  a.ok = false;
  a.img.onload = () => { a.ok = true; };
  a.img.src = ASSET + a.file;
});

// ===== 저장 (실패해도 게임은 동작) =====
function load(key) { try { return localStorage.getItem('animal_' + key); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem('animal_' + key, v); } catch (e) {} }

// ===== DOM =====
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const stage = $('stage');
const scoreEl = $('score'), bestEl = $('best'), nextImg = $('nextImg');

$('heroImg').src = ASSET + ANIMALS[LAST].file;
const evoImgs = ANIMALS.map((a, i) => {
  const img = document.createElement('img');
  img.src = ASSET + a.file;
  img.alt = a.name;
  img.style.height = (12 + i * 1.4) + 'px';
  $('evo').appendChild(img);
  return img;
});

// ===== 화면 맞춤 =====
let scale = 1, dpr = 1, floor = null;
function fit() {
  const sw = stage.clientWidth - 10, sh = stage.clientHeight - 5; // 울타리 테두리 두께 제외
  const s = sw / W;
  H = Math.max(560, Math.min(760, Math.floor(sh / s)));
  scale = Math.max(0.1, Math.min(s, sh / H));
  if (floor) Body.setPosition(floor, { x: W / 2, y: H + 50 });
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.style.width = W * scale + 'px';
  cvs.style.height = H * scale + 'px';
  cvs.width = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

// ===== 사운드 =====
let actx = null, muted = load('muted') === '1';
function updateSoundBtn() { $('soundBtn').textContent = muted ? '🔇' : '🔊'; }
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.18, slide = 0.5, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}
const sfx = {
  drop: () => tone(260, 0.09, 'sine', 0.08, 0.6),
  pop: lv => { const f = 950 - lv * 45; tone(f, 0.12, 'triangle', 0.16, 1.4); tone(f * 0.75, 0.16, 'sine', 0.1, 0.6, 0.05); },
  combo: n => tone(500 + n * 90, 0.12, 'triangle', 0.08, 1.3, 0.05),
  big: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.14, 1, i * 0.08)),
  over: () => { tone(420, 0.35, 'triangle', 0.15, 0.5); tone(300, 0.5, 'triangle', 0.12, 0.4, 0.25); },
};
function vibrate(ms) { if (navigator.vibrate && !muted) navigator.vibrate(ms); }

// ===== 게임 상태 =====
let engine, animals, mergeQueue, parts, texts;
let state = 'ready', score, best = Number(load('best')) || 0;
let current, next, aimX = W / 2, holding = false, canDrop, cooldownEnd;
let gameTime, combo, lastMerge, maxLevel, dangerTime, dangerLevel = 0, dropped;

function randSpawn() {
  const total = SPAWN_WEIGHTS.reduce((a, b) => a + b, 0);
  let n = Math.random() * total;
  for (let i = 0; i < SPAWN_WEIGHTS.length; i++) {
    n -= SPAWN_WEIGHTS[i];
    if (n < 0) return i;
  }
  return 0;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function reset() {
  if (engine) { Events.off(engine); Composite.clear(engine.world, false); Engine.clear(engine); }
  engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
  engine.gravity.y = 1.5;
  const wall = { isStatic: true, friction: 0.5, restitution: 0.1 };
  floor = Bodies.rectangle(W / 2, H + 50, W * 3, 100, wall);
  Composite.add(engine.world, [
    floor,                                              // 바닥
    Bodies.rectangle(-50, H / 2, 100, H * 4, wall),     // 왼쪽 벽
    Bodies.rectangle(W + 50, H / 2, 100, H * 4, wall),  // 오른쪽 벽
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);

  animals = []; mergeQueue = []; parts = []; texts = [];
  score = 0; gameTime = 0; combo = 0; lastMerge = -1e9;
  maxLevel = 0; dangerTime = 0; dropped = false;
  current = randSpawn(); next = randSpawn();
  canDrop = true; cooldownEnd = 0; holding = false;
  updateScore(); updateNext(); updateEvo();
}

function makeAnimal(level, x, y) {
  const b = Bodies.circle(x, y, ANIMALS[level].r, {
    restitution: 0.15, friction: 0.35, frictionStatic: 0.5, frictionAir: 0.012, density: 0.0015,
  });
  b.level = level;
  b.born = gameTime;
  b.merging = false;
  Composite.add(engine.world, b);
  animals.push(b);
  return b;
}

function removeAnimal(b) {
  Composite.remove(engine.world, b);
  const i = animals.indexOf(b);
  if (i >= 0) animals.splice(i, 1);
}

function onCollide(e) {
  for (const p of e.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.level === undefined || b.level === undefined) continue;
    if (a.level !== b.level || a.merging || b.merging) continue;
    a.merging = b.merging = true;
    mergeQueue.push([a, b]);
  }
}

function processMerges() {
  for (const [a, b] of mergeQueue) {
    const lv = a.level;
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    const vx = (a.velocity.x + b.velocity.x) / 2, vy = (a.velocity.y + b.velocity.y) / 2;
    removeAnimal(a); removeAnimal(b);

    combo = gameTime - lastMerge < COMBO_WINDOW ? combo + 1 : 1;
    lastMerge = gameTime;
    const mult = 1 + (combo - 1) * 0.5;

    if (lv === LAST) {
      // 젖소 + 젖소 → 음메~ 사라지고 보너스
      const pts = Math.round(FINAL_BONUS * mult);
      addScore(pts);
      burst(x, y, ANIMALS[lv].color, 40, true);
      burst(x, y, '#ffffff', 20, true);
      floatText(x, y, '음메~! +' + pts, true);
      sfx.big(); vibrate(80);
      continue;
    }

    const nl = lv + 1, r = ANIMALS[nl].r;
    const nb = makeAnimal(nl, clamp(x, r, W - r), y);
    Body.setVelocity(nb, { x: vx, y: Math.min(0, vy) - 1.2 });

    const pts = Math.round(MERGE_SCORE[nl] * mult);
    addScore(pts);
    burst(x, y, ANIMALS[nl].color, 10 + nl * 2, false);
    floatText(x, y - r * 0.6, combo > 1 ? `+${pts}  콤보×${combo}` : '+' + pts, combo > 1);
    sfx.pop(nl); if (combo > 1) sfx.combo(combo);
    vibrate(10 + nl * 3);

    if (nl > maxLevel) {
      maxLevel = nl;
      updateEvo();
      if (nl >= 5) toast(nl === LAST ? '🎉 젖소 완성!' : `새 친구! ${ANIMALS[nl].name}`);
    }
  }
  mergeQueue.length = 0;
}

function checkDanger() {
  let over = false, near = false;
  for (const b of animals) {
    if (b.merging || gameTime - b.born < 1200) continue; // 방금 떨어뜨린/합쳐진 동물은 잠깐 봐줌
    const top = b.position.y - ANIMALS[b.level].r;
    if (top < DANGER_Y) over = true;
    else if (top < DANGER_Y + 50) near = true;
  }
  dangerTime = over ? dangerTime + STEP : 0;
  dangerLevel = over ? 1 : near ? 0.5 : 0;
  if (dangerTime > DANGER_LIMIT) gameOver();
}

function drop() {
  if (!canDrop || state !== 'playing') return;
  const r = ANIMALS[current].r;
  const x = clamp(aimX, r + 1, W - r - 1) + (Math.random() - 0.5) * 0.4; // 완벽한 수직 쌓기 방지
  makeAnimal(current, x, DROP_Y);
  maxLevel = Math.max(maxLevel, current);
  current = next;
  next = randSpawn();
  canDrop = false;
  cooldownEnd = gameTime + 500;
  dropped = true;
  sfx.drop();
  updateNext(); updateEvo();
}

function gameOver() {
  state = 'over';
  holding = false;
  const isBest = score > best;
  if (isBest) { best = score; save('best', best); }
  sfx.over(); vibrate(200);
  setTimeout(() => {
    $('finalScore').textContent = score.toLocaleString();
    $('finalInfo').textContent = isBest
      ? '🏆 최고 기록 달성!'
      : `최고 기록 ${best.toLocaleString()} · 최고 동물 ${ANIMALS[maxLevel].name}`;
    $('overScreen').classList.remove('hidden');
  }, 700);
}

// ===== HUD =====
function addScore(p) {
  score += p;
  updateScore();
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
}
function updateScore() {
  scoreEl.textContent = score.toLocaleString();
  bestEl.textContent = Math.max(best, score).toLocaleString();
}
function updateNext() { nextImg.src = ASSET + ANIMALS[next].file; nextImg.alt = ANIMALS[next].name; }
function updateEvo() {
  evoImgs.forEach((img, i) => {
    img.classList.toggle('on', i <= maxLevel);
    img.classList.toggle('top', i === maxLevel);
  });
}
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ===== 효과 =====
function burst(x, y, color, n, big) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (big ? 4 : 1.5) + Math.random() * (big ? 6 : 3);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1,
                 size: (big ? 5 : 2.5) + Math.random() * 4, color });
  }
}
function floatText(x, y, text, strong) {
  texts.push({ x: clamp(x, 60, W - 60), y, text, strong, life: 1 });
}
function updateFx(k) {
  for (const p of parts) { p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.18 * k; p.life -= 0.03 * k; }
  for (const t of texts) { t.y -= 0.7 * k; t.life -= 0.018 * k; }
  parts = parts.filter(p => p.life > 0);
  texts = texts.filter(t => t.life > 0);
}

// ===== 그리기 =====
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; }

function drawAnimal(lv, x, y, angle, s) {
  const a = ANIMALS[lv];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (a.ok) {
    const [cx, cy, br] = a.body;
    const k = (a.r / br) * s;
    ctx.drawImage(a.img, -cx * k, -cy * k, a.img.naturalWidth * k, a.img.naturalHeight * k);
  } else {
    ctx.fillStyle = a.color;
    ctx.beginPath(); ctx.arc(0, 0, a.r * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 위험 구역
  if (dangerTime > 0) {
    ctx.fillStyle = `rgba(255,77,77,${0.08 + 0.22 * (dangerTime / DANGER_LIMIT)})`;
    ctx.fillRect(0, 0, W, DANGER_Y);
  }
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = dangerLevel >= 1
    ? `rgba(255,77,77,${0.6 + 0.4 * Math.sin(gameTime / 70)})`
    : dangerLevel > 0 ? 'rgba(255,140,60,.75)' : 'rgba(63,74,46,.18)';
  ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
  ctx.restore();

  // 첫 안내 문구
  if (state === 'playing' && !dropped) {
    ctx.fillStyle = 'rgba(63,74,46,.35)';
    ctx.font = '20px Jua, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('좌우로 끌어서 조준하고', W / 2, H * 0.58);
    ctx.fillText('손을 떼면 떨어져요', W / 2, H * 0.58 + 28);
  }

  // 조준선 + 들고 있는 동물
  if (state === 'playing' && canDrop) {
    const r = ANIMALS[current].r, x = clamp(aimX, r + 1, W - r - 1);
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = holding ? 'rgba(79,179,107,.85)' : 'rgba(63,74,46,.2)';
    ctx.beginPath(); ctx.moveTo(x, DROP_Y + r); ctx.lineTo(x, H); ctx.stroke();
    ctx.restore();
    drawAnimal(current, x, DROP_Y, 0, 1);
  }

  // 동물들 (새로 생긴 동물은 톡 튀어나오듯)
  for (const b of animals) {
    const age = gameTime - b.born;
    const s = age < 180 ? 0.55 + 0.45 * easeOutBack(age / 180) : 1;
    drawAnimal(b.level, b.position.x, b.position.y, b.angle, s);
  }

  // 파티클
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 점수 글자
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = (t.strong ? 26 : 20) + 'px Jua, sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#fff';
    ctx.fillStyle = t.strong ? '#e8602c' : '#3f4a2e';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

// ===== 메인 루프 =====
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;
  if (state === 'playing') {
    acc += dt;
    while (acc >= STEP) {
      Engine.update(engine, STEP);
      gameTime += STEP;
      processMerges();
      checkDanger();
      if (!canDrop && gameTime >= cooldownEnd) canDrop = true;
      if (state !== 'playing') break;
      acc -= STEP;
    }
  }
  updateFx(dt / STEP);
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

// ===== 입력 (터치 + 마우스) =====
function worldX(e) { return (e.clientX - cvs.getBoundingClientRect().left) / scale; }
stage.addEventListener('pointerdown', e => {
  if (state !== 'playing') return;
  e.preventDefault();
  initAudio();
  holding = true;
  aimX = worldX(e);
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (state !== 'playing') return;
  if (holding || e.pointerType === 'mouse') aimX = worldX(e);
});
stage.addEventListener('pointerup', e => {
  if (state !== 'playing' || !holding) return;
  holding = false;
  aimX = worldX(e);
  drop();
});
stage.addEventListener('pointercancel', () => { holding = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

$('soundBtn').addEventListener('click', () => {
  muted = !muted;
  save('muted', muted ? '1' : '0');
  updateSoundBtn();
  initAudio();
});
function start() {
  initAudio();
  reset();
  state = 'playing';
  $('startScreen').classList.add('hidden');
  $('overScreen').classList.add('hidden');
}
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);

// ===== 시작 =====
updateSoundBtn();
fit();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
